name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Validate skills
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          dirs=(skills/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::No skills found under skills/"; exit 1
          fi
          declare -A names
          for dir in "${dirs[@]}"; do
            name="$(basename "$dir")"
            skill="$dir/SKILL.md"
            echo "::group::$name"
            if [ ! -f "$skill" ]; then
              echo "::error::$skill missing"; fail=1; echo "::endgroup::"; continue
            fi
            if ! fm_name="$(ruby -ryaml -e '
              path = ARGV.fetch(0)
              lines = File.readlines(path)
              abort("frontmatter must start with ---") unless lines.first&.chomp == "---"
              closing = lines.drop(1).index { |line| line.chomp == "---" }
              abort("frontmatter closing --- missing") unless closing
              data = YAML.safe_load(lines[1, closing].join, permitted_classes: [], aliases: false)
              abort("frontmatter must be a mapping") unless data.is_a?(Hash)
              name = data["name"]
              description = data["description"]
              abort("frontmatter name must be a non-empty string") unless name.is_a?(String) && !name.empty?
              abort("frontmatter description must be a non-empty string") unless description.is_a?(String) && !description.strip.empty?
              puts name
            ' "$skill")"; then
              echo "::error::$skill: invalid YAML frontmatter"; fail=1; echo "::endgroup::"; continue
            fi
            if [ "$fm_name" != "$name" ]; then
              echo "::error::$skill: name '$fm_name' != directory '$name'"; fail=1
            fi
            if [ -n "${names[$fm_name]:-}" ]; then
              echo "::error::duplicate skill name '$fm_name'"; fail=1
            fi
            names[$fm_name]=1
            # referenced local files must exist
            while IFS= read -r link; do
              ref="${link#*\(}"
              ref="${ref%%#*}"
              ref="${ref%%\?*}"
              if [[ "$ref" == ./* ]]; then
                ref="${ref#./}"
              fi
              if [ ! -e "$dir$ref" ]; then
                echo "::error::$skill: local reference target not found: $ref"
                fail=1
              fi
            done < <(grep -oE '\]\((\./)?(references|scripts|tests)/[^)[:space:]]+' "$skill" || true)
            # scripts must be executable and parse
            for script in "$dir"scripts/*; do
              [ -x "$script" ] || { echo "::error::$script not executable"; fail=1; }
              bash -n "$script" 2>/dev/null || { echo "::error::$script: syntax error"; fail=1; }
            done
            echo "ok: $name"
            echo "::endgroup::"
          done
          exit $fail
